# ==============================================================================
# Render Blueprint Specification for PocketMate
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Web Service: Next.js Full-Stack Application
  # ----------------------------------------------------------------------------
  - type: web
    name: pocketmate
    runtime: node
    plan: free # 100% Free Tier - No credit card or payment info required!
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Your Neon serverless PostgreSQL connection string
      - key: GEMINI_API_KEY
        sync: false # Google AI Studio API key
      - key: GEMINI_API_KEY_SECONDARY
        sync: false # Optional failover API key
      - key: PAYPAL_CLIENT_ID
        sync: false # PayPal Sandbox Client ID
      - key: PAYPAL_CLIENT_SECRET
        sync: false # PayPal Sandbox Client Secret
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false # PayPal Sandbox Webhook ID for signature verification
      - key: NEXTAUTH_SECRET
        generateValue: true # Render automatically generates a cryptographically secure secret
      - key: CRON_SECRET
        generateValue: true # Secret token for the audit endpoint
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false
      - key: NEXT_PUBLIC_BRYNTUM_LICENSE_KEY
        sync: false
